[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.9"
hilt = "2.59.2"
composeBom = "2026.06.00"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
